name: Discord Release Notification

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_plan_identity:
        required: true
        type: string
      automatic:
        required: false
        default: true
        type: boolean
      message:
        required: false
        type: string
      image_url:
        required: false
        type: string
      mention_user_id:
        required: false
        type: string
      dry_run:
        required: false
        default: false
        type: boolean
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to inspect or retry, such as v1.56.0
        required: true
        type: string
      release_plan_identity:
        description: Optional release-plan identity for audit correlation
        required: false
        type: string
      automatic:
        description: Use automatic deduplication; leave off for an operator-authorized retry
        required: false
        default: false
        type: boolean
      message:
        description: Optional custom message above the release embed
        required: false
        type: string
      image_url:
        description: Optional public HTTPS image URL
        required: false
        type: string
      mention_user_id:
        description: Optional Discord user ID allow-listed for {mention}
        required: false
        type: string
      dry_run:
        description: Print the payload without posting
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: discord-release-${{ inputs.release_plan_identity || inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Compute identity-bound notification key
        id: identity
        env:
          BUGDROP_NOTIFICATION_AUTOMATIC: ${{ inputs.automatic }}
          BUGDROP_NOTIFICATION_DRY_RUN: ${{ inputs.dry_run }}
          BUGDROP_NOTIFICATION_IMAGE_URL: ${{ inputs.image_url }}
          BUGDROP_NOTIFICATION_MENTION_USER_ID: ${{ inputs.mention_user_id }}
          BUGDROP_NOTIFICATION_MESSAGE: ${{ inputs.message }}
          BUGDROP_RELEASE_PLAN_IDENTITY: ${{ inputs.release_plan_identity }}
          BUGDROP_RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/discord-release.mjs key >> "$GITHUB_OUTPUT"

      - name: Restore successful automatic notification marker
        if: inputs.automatic && !inputs.dry_run
        id: dedupe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .discord-release-dedup/${{ steps.identity.outputs.notification_key }}
          key: discord-release-${{ steps.identity.outputs.notification_key }}

      - name: Send, retry, inspect, or skip notification
        if: steps.dedupe.outputs.cache-hit != 'true' || !inputs.automatic || inputs.dry_run
        env:
          BUGDROP_NOTIFICATION_ALREADY_SENT: ${{ steps.dedupe.outputs.cache-hit }}
          BUGDROP_NOTIFICATION_AUTOMATIC: ${{ inputs.automatic }}
          BUGDROP_NOTIFICATION_DRY_RUN: ${{ inputs.dry_run }}
          BUGDROP_NOTIFICATION_IMAGE_URL: ${{ inputs.image_url }}
          BUGDROP_NOTIFICATION_MENTION_USER_ID: ${{ inputs.mention_user_id }}
          BUGDROP_NOTIFICATION_MESSAGE: ${{ inputs.message }}
          BUGDROP_RELEASE_PLAN_IDENTITY: ${{ inputs.release_plan_identity }}
          BUGDROP_RELEASE_TAG: ${{ inputs.tag }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discord-release.mjs notify

      - name: Record successful automatic notification
        if: inputs.automatic && !inputs.dry_run && steps.dedupe.outputs.cache-hit != 'true'
        shell: bash
        run: |
          marker_dir=".discord-release-dedup/${{ steps.identity.outputs.notification_key }}"
          mkdir -p "$marker_dir"
          echo "${{ inputs.tag }}" > "$marker_dir/tag"

      - name: Save successful automatic notification marker
        if: inputs.automatic && !inputs.dry_run && steps.dedupe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .discord-release-dedup/${{ steps.identity.outputs.notification_key }}
          key: discord-release-${{ steps.identity.outputs.notification_key }}
