name: Live Widget Tests

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      widget_origin:
        required: true
        type: string
      widget_sha256:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      exact_filename:
        required: true
        type: string
      alias_filenames_json:
        required: true
        type: string
      retained_assets_json:
        required: true
        type: string
    secrets:
      BUGDROP_HEARTBEAT_MONITOR_PRIVATE_KEY:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [preview, production]
        default: preview
      target_sha:
        description: Optional exact 40-character build SHA; provide the complete identity set
        required: false
        type: string
      version:
        description: Optional stable release version
        required: false
        type: string
      widget_origin:
        description: Optional exact HTTPS widget origin
        required: false
        type: string
      widget_sha256:
        description: Optional expected widget SHA-256
        required: false
        type: string
      manifest_sha256:
        description: Optional expected versions.json SHA-256
        required: false
        type: string
      exact_filename:
        description: Optional exact-version widget filename
        required: false
        type: string
      alias_filenames_json:
        description: JSON array of expected mutable alias filenames
        required: false
        type: string
      retained_assets_json:
        description: JSON object of retained exact and stable alias filenames to SHA-256 values
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'

permissions: {}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'bugdrop-shared-preview' || format('bugdrop-live-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  live-tests:
    name: Live E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LIVE_TARGET: ${{ github.event_name == 'schedule' && 'preview' || inputs.target || 'preview' }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.target == 'production' && 'https://bugdrop-widget-test.vercel.app' || 'https://bugdrop-widget-test-git-preview-jermwatts-projects.vercel.app' }}
      BUGDROP_CANARY_REPO: ${{ vars.BUGDROP_TEST_REPOSITORY || 'mean-weasel/bugdrop-widget-test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: make install

      - name: Install Playwright
        run: make install-playwright

      - name: Select explicit widget origin
        shell: bash
        env:
          REQUESTED_WIDGET_ORIGIN: ${{ inputs.widget_origin }}
        run: |
          if [ -n "$REQUESTED_WIDGET_ORIGIN" ]; then
            WIDGET_ORIGIN="$REQUESTED_WIDGET_ORIGIN"
          elif [ "$LIVE_TARGET" = "preview" ]; then
            WIDGET_ORIGIN="https://bugdrop-preview.neonwatty.workers.dev"
          else
            WIDGET_ORIGIN="https://bugdrop.neonwatty.workers.dev"
          fi
          echo "EXPECTED_WIDGET_ORIGIN=$WIDGET_ORIGIN" >> "$GITHUB_ENV"

      - name: Verify exact plan identity or observe scheduled identity
        id: live-identity
        shell: bash
        env:
          EXPECTED_TARGET_SHA: ${{ inputs.target_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_WIDGET_SHA256: ${{ inputs.widget_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          EXPECTED_EXACT_FILENAME: ${{ inputs.exact_filename }}
          EXPECTED_ALIAS_FILENAMES: ${{ inputs.alias_filenames_json }}
          EXPECTED_RETAINED_ASSETS: ${{ inputs.retained_assets_json }}
        run: |
          identity_values=(
            "$EXPECTED_TARGET_SHA"
            "$EXPECTED_VERSION"
            "$EXPECTED_WIDGET_ORIGIN"
            "$EXPECTED_WIDGET_SHA256"
            "$EXPECTED_MANIFEST_SHA256"
            "$EXPECTED_EXACT_FILENAME"
            "$EXPECTED_ALIAS_FILENAMES"
            "$EXPECTED_RETAINED_ASSETS"
          )
          present=0
          for value in "${identity_values[@]}"; do
            if [ -n "$value" ]; then
              present=$((present + 1))
            fi
          done

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            identity_json=$(node scripts/release/verify-live.mjs preview-observe)
          elif [ "$present" -eq "${#identity_values[@]}" ]; then
            identity_json=$(node scripts/release/verify-live.mjs verify)
          else
            echo 'Non-scheduled live tests require the complete explicit plan identity.' >&2
            exit 1
          fi

          widget_sha=$(jq -er '.widgetSha256' <<< "$identity_json")
          fixture_path="$RUNNER_TEMP/bugdrop-live-widget-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.js"
          candidate_path="$fixture_path.candidate"
          curl --max-time 30 -sSf "$EXPECTED_WIDGET_ORIGIN/widget.js" -o "$candidate_path"
          actual_sha=$(shasum -a 256 "$candidate_path" | awk '{print $1}')
          if [ "$actual_sha" != "$widget_sha" ]; then
            echo "Observed widget changed from $widget_sha to $actual_sha before browser tests." >&2
            exit 1
          fi
          mv "$candidate_path" "$fixture_path"
          echo "EXPECTED_WIDGET_SHA256=$widget_sha" >> "$GITHUB_ENV"
          echo "EXACT_WIDGET_FIXTURE_PATH=$fixture_path" >> "$GITHUB_ENV"
          echo "$identity_json"

      - name: Verify test venue is reachable
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          bypass_args=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            bypass_args=(-H "x-vercel-protection-bypass:${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          curl -sfo /dev/null "${bypass_args[@]}" "$PLAYWRIGHT_BASE_URL"

      - name: Run live E2E tests
        run: npx playwright test --project=chromium-live --workers=1 --retries=0
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Run live Radix E2E tests
        run: make test-live-radix
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Select monitoring App installation
        if: always() && github.event_name == 'schedule'
        shell: bash
        run: |
          case "$BUGDROP_CANARY_REPO" in
            mean-weasel/bugdrop-widget-test|bugdrophq/bugdrop-widget-test) ;;
            *) echo "Unapproved BugDrop canary repository: $BUGDROP_CANARY_REPO" >&2; exit 1 ;;
          esac
          echo "BUGDROP_CANARY_REPO_OWNER=${BUGDROP_CANARY_REPO%%/*}" >> "$GITHUB_ENV"
          echo "BUGDROP_CANARY_REPO_NAME=${BUGDROP_CANARY_REPO#*/}" >> "$GITHUB_ENV"

      - name: Mint monitoring-only GitHub App token
        id: scheduled-monitor-token
        if: always() && github.event_name == 'schedule'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.BUGDROP_HEARTBEAT_MONITOR_APP_ID }}
          private-key: ${{ secrets.BUGDROP_HEARTBEAT_MONITOR_PRIVATE_KEY }}
          owner: ${{ env.BUGDROP_CANARY_REPO_OWNER }}
          repositories: ${{ env.BUGDROP_CANARY_REPO_NAME }}
          permission-issues: write

      - name: Sweep stale merge-queue canaries
        if: always() && github.event_name == 'schedule'
        run: >-
          node scripts/github-issue-canary.mjs sweep
          --profile preview
          --repo "$BUGDROP_CANARY_REPO"
          --prefix "[BugDrop CI canary]"
        env:
          BUGDROP_CANARY_GITHUB_TOKEN: ${{ steps.scheduled-monitor-token.outputs.token }}

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-live-report
          path: playwright-report/
          retention-days: 7
