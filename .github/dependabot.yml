version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Phoenix
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: chore(deps)
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        exclude-patterns:
          - wrangler
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Phoenix
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
