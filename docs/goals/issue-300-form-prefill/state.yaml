# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Implement Issue #300 form prefills"
  slug: "issue-300-form-prefill"
  kind: existing_plan # specific | open_ended | existing_plan | recovery | audit
  tranche: "Validate the existing plan, implement the complete built-in form prefill feature and user documentation, then prove compatibility and safety."
  status: active # active | blocked | done
  oracle:
    signal: "Browser walkthrough and tests prove host-supplied prefills, category templates, edited-text preservation, email disclosure, and legacy behavior; API tests prove submitter formatting is safe."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed unit, API, typecheck, lint, and E2E evidence on the final diff; user-facing docs show a working host callback and say identity is unverified; final Judge audit finds no required work left."
  intake:
    original_request: "Implement Issue #300 as a GoalBuddy prep board, including user documentation and honest unverified-identity guidance."
    interpreted_outcome: "Ship optional built-in form prefills for nickname, email, and category-specific description templates, with safe rendering and complete integration docs."
    input_shape: existing_plan # vague | specific | existing_plan | recovery | audit
    audience: "BugDrop integrators and feedback submitters"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: test # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "Working default widget behavior, safe Issue body output, and published-source documentation verified against the final implementation diff."
    likely_misfire: "A plan-only or custom-variant-only change is reported complete, or prefills are presented as verified identity."
    blind_spots_considered:
      - "Legacy BugDrop.open() must keep ignoring arguments."
      - "A category switch must not overwrite reporter-edited text."
      - "Email in a GitHub Issue may be visible to everyone when the repository is public."
      - "The fresh worktree has the plan only; the original checkout contains unrelated dirty changes."
    existing_plan_facts:
      - "Validate docs/plans/2026-09-30-issue-300-form-prefill.md before implementation."
      - "Use a per-open host callback rather than repurposing BugDrop.open() arguments."
      - "Update configuration, JavaScript API, and security/FAQ documentation."
      - "Treat name and email as untrusted, unverified suggestions."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  # missing and bundled_not_installed use PM fallback; unknown requires one exact-role attempt before fallback.
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live # not_requested | starting | live | generated | blocked
    url: "http://goalbuddy.localhost:41737/issue-300-form-prefill/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/issue-300-form-prefill"

