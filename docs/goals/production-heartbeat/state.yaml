version: 2

goal:
  title: "Production Heartbeat"
  slug: "production-heartbeat"
  kind: existing_plan
  tranche: "Complete successive safe verified slices through local implementation, authorized live proof, and staged activation."
  status: active
  oracle:
    signal: "A production widget submission creates exactly one verified synthetic Issue, closes it with zero stale heartbeat Issues, and drives one deduplicated incident Issue through failure and recovery."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed local checks plus authorized live production transaction, cleanup, incident, and recovery evidence."
  intake:
    original_request: "Create the implementation plan for the agreed production heartbeat using GoalBuddy Prep."
    interpreted_outcome: "A safe executable board delivers a four-hour production heartbeat without weakening the merge-triggered preview canary."
    input_shape: existing_plan
    audience: "BugDrop maintainers and operators"
    authority: approved
    proof_type: demo
    completion_proof: "The full live oracle succeeds and a final audit records full_outcome_complete: true."
    likely_misfire: "Declaring success from workflow syntax or mocked tests without proving the real production Issue lifecycle and incident recovery."
    blind_spots_considered:
      - "GitHub schedule timing is approximate."
      - "GitHub is shared by the monitored Issue transaction and the incident channel."
      - "Production and preview cleanup must not collide."
      - "Continued execution can hide cleanup or alert failures unless final aggregation fails closed."
      - "Unrelated dirty work must be preserved."
      - "Execution must not accidentally inherit changes from the original feature worktree."
    existing_plan_facts:
      - "Use a dedicated staggered four-hour production workflow and production-only concurrency lock."
      - "Add and verify production environment and full Worker build identity."
      - "Share a canary engine behind strict preview and production profiles."
      - "Use distinct marker prefixes, independent verification, unconditional cleanup, and zero-open sweeps."
      - "Manage one deduplicated incident Issue directly through GitHub Actions."
      - "Keep preview mutating tests deployment-triggered; retain daily nonmutating health and janitor coverage."
      - "Require contract, unit, intercepted browser, adversarial, and authorized live proof."
      - "Stage rollout from manual to daily soak to every four hours."
      - "Execute only in /Users/neonwatty/Desktop/bugdrop-production-heartbeat on codex/production-heartbeat, created from freshly fetched origin/main at 75c0e5c7009e804c6d9e03f4886188d4f7b2094d."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/production-heartbeat-2/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.2/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/production-heartbeat"

