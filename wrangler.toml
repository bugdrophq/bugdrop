name = "bugdrop"
main = "src/index.ts"
compatibility_date = "2024-01-29"
workers_dev = true

routes = [
  { pattern = "bugdrop.dev/board*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/board-dogfood*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/bugdrop-board-token*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/github/webhook*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/stats/feedback-issues*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/stats/installations*", zone_name = "bugdrop.dev" },
]

[triggers]
crons = ["17 3 * * *", "7 * * * *"]

# Static assets directory (for widget.js)
[assets]
directory = "public"
binding = "ASSETS"

# Environment variables
[vars]
# Optional exact repository allowlist (unset allows all installed repositories).
# ALLOWED_REPOSITORIES = "example-org/app,example-org/feedback"
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "*"  # "*" for dev, comma-separated URLs for production
GITHUB_APP_NAME = "neonwatty-bugdrop"  # Your GitHub App's URL slug
MAX_SCREENSHOT_SIZE_MB = "5"  # Maximum screenshot size in MB
BUGDROP_BOARD_TENANT_ID = "tenant_mean_weasel"
BUGDROP_BOARD_APP_ID = "app_mean_weasel_bugdrop_dogfood"
FEEDBACK_COUNT_BASELINE = "0"
FEEDBACK_COUNT_EXCLUDED_OWNERS = "mean-weasel,neonwatty,bugdrophq"
INSTALLATION_COUNT_EXCLUDED_OWNERS = "mean-weasel,neonwatty,bugdrophq"

[durable_objects]
bindings = [{ name = "FEEDBACK_COUNTER", class_name = "FeedbackCounter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackCounter"]

# Rate limiting KV namespace
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e6454ed79f514ed3a9e24eea99dd6cd3"
preview_id = "ff8f3809037d4403befd09369a9f7e36"

[[kv_namespaces]]
binding = "INSTALLATION_ANALYTICS"
id = "a567f723a2eb4cfab807b0c1d678dc76"

# Secrets (set with: wrangler secret put GITHUB_APP_ID)
# GITHUB_APP_ID
# GITHUB_PRIVATE_KEY
# GITHUB_WEBHOOK_SECRET
# AUTH_TOKEN_SECRET  # Optional: set to require signed host-app auth tokens for /feedback
# VARIANT_LABELS  # Optional: JSON object keyed by repo, then structured variant ID
# BUGDROP_BOARD_TOKEN_SECRET  # Optional: enables /board embedded demo token signing

# Preview environment for live E2E tests (deployed in merge queue)
[env.preview]
name = "bugdrop-preview"
workers_dev = true
routes = []

[env.preview.vars]
# Optional exact repository allowlist (unset allows all installed repositories).
# ALLOWED_REPOSITORIES = "example-org/app,example-org/feedback"
ENVIRONMENT = "preview"
ALLOWED_ORIGINS = "*"
GITHUB_APP_NAME = "neonwatty-bugdrop"
MAX_SCREENSHOT_SIZE_MB = "5"
FEEDBACK_COUNT_BASELINE = "0"
FEEDBACK_COUNT_EXCLUDED_OWNERS = "mean-weasel,neonwatty,bugdrophq"
INSTALLATION_COUNT_EXCLUDED_OWNERS = "mean-weasel,neonwatty,bugdrophq"

[env.preview.durable_objects]
bindings = [{ name = "FEEDBACK_COUNTER", class_name = "FeedbackCounter" }]

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT"
id = "cdb88fa95d6348d6ab84037751853d5d"

[[env.preview.kv_namespaces]]
binding = "INSTALLATION_ANALYTICS"
id = "c58b33f6a0dc416b8661661ce0d23f7f"

# Controller-owned production target. The release workflow must still pass
# BUILD_SHA explicitly and remains frozen until the later operator cutover.
[env.production]
name = "bugdrop"
workers_dev = true
routes = [
  { pattern = "bugdrop.dev/board*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/board-dogfood*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/bugdrop-board-token*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/github/webhook*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/stats/feedback-issues*", zone_name = "bugdrop.dev" },
  { pattern = "bugdrop.dev/api/stats/installations*", zone_name = "bugdrop.dev" },
]

[env.production.triggers]
crons = ["17 3 * * *", "7 * * * *"]

[env.production.assets]
directory = "public"
binding = "ASSETS"

[env.production.vars]
# Optional exact repository allowlist (unset allows all installed repositories).
# ALLOWED_REPOSITORIES = "example-org/app,example-org/feedback"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "*"
GITHUB_APP_NAME = "neonwatty-bugdrop"
MAX_SCREENSHOT_SIZE_MB = "5"
BUGDROP_BOARD_TENANT_ID = "tenant_mean_weasel"
BUGDROP_BOARD_APP_ID = "app_mean_weasel_bugdrop_dogfood"
FEEDBACK_COUNT_BASELINE = "3116"
FEEDBACK_COUNT_EXCLUDED_OWNERS = "mean-weasel,neonwatty,bugdrophq"
INSTALLATION_COUNT_EXCLUDED_OWNERS = "mean-weasel,neonwatty,bugdrophq"
INSTALLATION_USAGE_ENABLED = "true"

[env.production.durable_objects]
bindings = [{ name = "FEEDBACK_COUNTER", class_name = "FeedbackCounter" }]

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "e6454ed79f514ed3a9e24eea99dd6cd3"

[[env.production.kv_namespaces]]
binding = "INSTALLATION_ANALYTICS"
id = "a567f723a2eb4cfab807b0c1d678dc76"
